name: "Tool or improvement"
description: "Propose concrete developer value with evidence"
title: "[Proposal] "
body:
  - type: textarea
    id: problem
    attributes:
      label: "Concrete problem"
      description: "Who has this problem, and what useful result should the project deliver?"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "Primary source for an external tool"
  - type: textarea
    id: license
    attributes:
      label: "License and unknowns"
      description: "Distinguish code, models, data, services, and any unresolved terms."
  - type: textarea
    id: verification
    attributes:
      label: "Available evidence"
      description: "State whether this is source review only or an executed test with version, environment, commands, and outcome."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criterion"
      description: "How will we verify that the proposal is actually useful?"
    validations:
      required: true
