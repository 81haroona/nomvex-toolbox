name: "Défaut / Bug report"
description: "Signaler un défaut reproductible sans données sensibles / Report a reproducible defect without sensitive data"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Pour une vulnérabilité, suivez SECURITY.md. Ne publiez aucun secret ou compte client. / For vulnerabilities, follow SECURITY.md. Do not disclose secrets or customer accounts."
  - type: input
    id: version
    attributes:
      label: "Version ou commit / Version or commit"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environnement / Environment"
      description: "Système, Node, navigateur / OS, Node, browser"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Reproduction minimale / Minimal reproduction"
      description: "Commandes et configuration anonymisée / Commands and sanitized configuration"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Résultat attendu et observé / Expected and observed result"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Preuves et limites / Evidence and limitations"
      description: "Extraits de rapport vérifiés avant partage ; contrôles non effectués / Reviewed report excerpts and checks not performed"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Avant envoi / Before submitting"
      options:
        - label: "J’ai retiré les secrets et données personnelles. / I removed secrets and personal data."
          required: true
