name: "Bug report"
description: "Report a reproducible defect without sensitive data"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Do not disclose secrets, personal data, or customer accounts."
  - type: input
    id: version
    attributes:
      label: "Version or commit"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Operating system, Node version, browser, and relevant dependency versions."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Minimal reproduction"
      description: "Commands and sanitized configuration. Remove credentials and private URLs."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected and observed result"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence and limitations"
      description: "Reviewed report excerpts, exit codes, and checks that were not performed."
  - type: checkboxes
    id: privacy
    attributes:
      label: "Before submitting"
      options:
        - label: "I removed secrets, personal data, and customer information."
          required: true
