name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - if: runner.os == 'Linux'
        run: npx --no-install playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        shell: bash
        run: |
          # Browser CDN TLS or networking can fail transiently. Never disable
          # certificate verification and never continue without Chromium.
          for attempt in 1 2 3; do
            if npx --no-install playwright install chromium; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
      - run: npm run typecheck
      - run: npm run catalog:check
      - run: npm test
      - run: npm run demo
      - run: npm run verify:broken-demo
      - run: npm pack --dry-run
