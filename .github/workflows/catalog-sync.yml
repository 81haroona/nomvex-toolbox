name: Open-source catalog sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog/sources.json'
      - 'catalog/seeds.json'
      - 'scripts/sync-open-source.mjs'
      - 'scripts/open-source-lib.mjs'
      - '.github/workflows/catalog-sync.yml'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: open-source-catalog-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refresh public open-source index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run catalog:sync
      - run: npm run catalog:check
      - run: node --test tests/open-source-registry.test.mjs
      - name: Create or update data-only pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- catalog/candidates.json catalog/open-source-index.json catalog/open-source-quarantine.json; then
            echo "No catalog changes."
            exit 0
          fi
          # Every refresh creates a new reviewable snapshot branch. Reusing the
          # old automation branch requires unsafe overwrites and stale leases.
          branch="automation/open-source-catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add catalog/candidates.json catalog/open-source-index.json catalog/open-source-quarantine.json
          git commit -m "chore: refresh open-source registry"
          # Push only this new branch. Never force-update an existing review.
          git push origin "HEAD:refs/heads/$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" --title "chore: refresh open-source registry" --body "Automated data-only refresh of candidates/index/quarantine. Only public, non-archived, non-fork GitHub repositories with allowlisted SPDX metadata are admitted. No upstream code is executed or vendored."
          fi
          # A PR opened with GITHUB_TOKEN does not normally trigger pull_request
          # CI. Check the synthetic merge SHA, never only the data branch head.
          pr_number="$(gh pr view "$branch" --json number --jq .number)"
          pr_head="$(gh pr view "$branch" --json headRefOid --jq .headRefOid)"
          merge_sha=""
          for attempt in 1 2 3 4 5 6; do
            merge_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq .merge_commit_sha)" || true
            if [[ "$merge_sha" =~ ^[a-f0-9]{40}$ ]] && [[ "$merge_sha" != "$pr_head" ]]; then break; fi
            sleep 3
          done
          if [[ ! "$merge_sha" =~ ^[a-f0-9]{40}$ ]] || [[ "$merge_sha" == "$pr_head" ]]; then
            echo "::error::GitHub did not provide a distinct review merge commit; no CI dispatched."
            exit 1
          fi
          check_branch="ci/catalog-pr-${pr_number}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/heads/$check_branch" -f "sha=$merge_sha" >/dev/null
          gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref "$check_branch"
          echo "Catalog PR #$pr_number: six required CI checks dispatched at merge SHA $merge_sha"
